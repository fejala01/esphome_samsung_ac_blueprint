blueprint:
  name: Samsung Wärmepumpe Fehlerbenachrichtigungen
  description: >
    Dieses Blueprint überwacht einen ausgewählten Sensor auf bestimmte Fehlercodes von Samsung Wärmepump-Geräten 
    und sendet Benachrichtigungen an ein ausgewähltes Gerät mit einer detaillierten Fehlermeldung.
  domain: automation
  input:
    sensor_entity:
      name: Fehlercode Sensor
      description: Der Sensor, der die AC-Fehlercodes überwacht.
      selector:
        entity:
          domain: sensor
    
    notify_device:
      name: Benachrichtigungsgerät
      description: Das Gerät muss die offizielle Home Assistant-App ausführen, um Benachrichtigungen zu erhalten.
      selector:
        device:
          integration: mobile_app
    
    is_ios:
      name: Handelt es sich um ein iOS-Gerät?
      description: Anwählen, wenn das ausgewählte Gerät unter iOS läuft, Standard ist Android.
      selector:
        boolean:
      default: false

    notification_title:
      name: Benachrichtigungstitel (Optional)
      description: 'Standard: "Samsung Fehlermeldung"'
      default: "Samsung Fehlermeldung"
      
    notification_message:
      name: Benachrichtig (Optional)
      description: 'Standard: {{ error_code }}:\n{{ error_message }}'
      default: "Fehlercode {{ error_code }}:\n{{ error_message }}"

trigger:
  platform: state
  entity_id: !input sensor_entity
  for: "00:00:45"

variables:
  error_code: "{{ states[trigger.entity_id].state }}"
  error_message: >
    {% if error_code == 0 %}
      Die Wärmepumpe arbeitet normal.
    {% elif error_code == "unavailable" %}
      Die Wärmepumpe ist offline.
    {% elif error_code == 101 %}
      Kommunikationsfehler der Inneneinheit. Innengerät kann keine Daten vom Außengerät empfangen.
    {% elif error_code == 102 %}
      Kommunikationsfehler zwischen Innengerät und Außengerät. Wird im Innengerät angezeigt.
    {% elif error_code == 108 %}
      Fehler durch wiederholte Adresseinstellung (wenn 2 oder mehr Geräte innerhalb des Systems die gleiche Adresse haben).
    {% elif error_code == 110 %}
      Kommunikationsfehler zwischen dem Hydrogerät HT (Haupt-PBA) und dem PBA des Steuergeräts (Erkennung vom Steuergerät).
    {% elif error_code == 120 %}
     Kurzschluss- oder Leerlauffehler des Raumtemperaturfühlers des Innengeräts der Zone 2 (wird nur bei Verwendung des Raumthermostats erkannt).
    {% elif error_code == 121 %}
      Fehler am Innentemperatursensor des Innengeräts (Kurzschluss oder offen).
    {% elif error_code == 122 %}
      Fehler am EVA IN-Sensor des Innengeräts (Kurzschluss oder offen).
    {% elif error_code == 123 %}
      Fehler am EVA OUT-Sensor des Innengeräts (Kurzschluss oder offen).
    {% elif error_code == 128 %}
      Der EVA IN-Temperatursensor des Innengeräts hat sich vom EVA IN-Rohr gelöst.
    {% elif error_code == 129 %}
      Der EVA-OUT-Temperatursensor der Inneneinheit ist vom EVA-OUT-Rohr getrennt.
    {% elif error_code == 130 %}
      Die Wärmeübertrager-Ein-/Ausgangssensoren der Inneneinheit sind getrennt.
    {% elif error_code == 135 %}
      RPM-Rückmeldungsfehler des Reinigungsventilators der Inneneinheit.
    {% elif error_code == 151 %}
      Fehler aufgrund eines geöffneten EEV der Inneneinheit (zweite Erkennung).
    {% elif error_code == 152 %}
      Fehler aufgrund eines geschlossenen EEV der Inneneinheit (zweite Erkennung).
    {% elif error_code == 153 %}
      Fehler am Schwimmerschalter der Inneneinheit (zweite Erkennung).
    {% elif error_code == 154 %}
      RPM-Rückmeldungsfehler der Inneneinheit.
    {% elif error_code == 161 %}
      Fehler im gemischten Betriebsmodus der Inneneinheit; wenn die Außeneinheit sich auf den Kühl- (oder Heiz-) Betrieb vorbereitet und einige Inneneinheiten versuchen, im Heiz- (oder Kühl-) Modus zu arbeiten.
    {% elif error_code == 162 %}
      EEPROM-Fehler von MICOM (physisches Problem mit Bauteilen/Schaltung).
    {% elif error_code == 163 %}
      Die Optionseingabe der Fernbedienung der Inneneinheit ist falsch oder fehlt. Fehler in den EEPROM-Daten der Außeneinheit.
    {% elif error_code == 180 %}
      Gleichzeitige Öffnung des Kühl-/Heiz-MCU-SOL-Ventils (erste Erkennung).
    {% elif error_code == 181 %}
      Gleichzeitige Öffnung des Kühl-/Heiz-MCU-SOL-Ventils (zweite Erkennung).
    {% elif error_code == 185 %}
      Kreuzverdrahtungsfehler zwischen Kommunikations- und Stromkabel der Inneneinheit.
    {% elif error_code == 186 %}
      Verbindungsfehler oder Problem mit SPi.
    {% elif error_code == 190 %}
      Keine Temperaturänderung in EVA IN während der Rohrinspektion oder Temperaturänderung in der Inneneinheit mit falscher Adresse.
    {% elif error_code == 191 %}
      Keine Temperaturänderung in EVA OUT während der Rohrinspektion oder Temperaturänderung in der Inneneinheit mit falscher Adresse.
    {% elif error_code == 198 %}
      Fehler aufgrund einer getrennten Thermosicherung der Inneneinheit.
    {% elif error_code == 201 %}
      Kommunikationsfehler zwischen Innen- und Außeneinheiten (Fehler bei der Installationsnummerneinstellung, doppelte Adresse einer Inneneinheit, Kommunikationskabel-Fehler der Inneneinheit).
    {% elif error_code == 202 %}
      Kommunikationsfehler zwischen Innen- und Außeneinheiten (Kommunikationsfehler bei allen Inneneinheiten, Kommunikationskabel-Fehler der Außeneinheit).
    {% elif error_code == 203 %}
      Kommunikationsfehler zwischen Haupt- und Neben-Außeneinheiten.
    {% elif error_code == 205 %}
      Kommunikationsfehler bei allen PBA innerhalb der Außeneinheit C-Box, Kommunikationskabel-Fehler.
    {% elif error_code == 206 %}
      HUB-PBA-Kommunikationsfehler / FAN-PBA-Kommunikationsfehler / INV1-PBA-Kommunikationsfehler / INV2-PBA-Kommunikationsfehler.
    {% elif error_code == 211 %}
      Wenn eine einzelne Inneneinheit zwei MCU-Ports verwendet, die nicht in Reihe geschaltet sind.
    {% elif error_code == 212 %}
      Wenn der Drehschalter (am MCU) zur Adressierung der Inneneinheit dreimal oder öfter dieselbe Adresse hat.
    {% elif error_code == 213 %}
      Wenn die Gesamtzahl der Inneneinheiten, die dem MCU zugewiesen sind, der tatsächlichen Anzahl der installierten Inneneinheiten entspricht, aber eine Inneneinheit nicht installiert ist, obwohl sie dem MCU zugewiesen wurde.
    {% elif error_code == 214 %}
      Wenn die Anzahl der MCU an der Außeneinheit nicht korrekt eingestellt ist oder wenn zwei oder mehr MCUs installiert wurden und einige dieselbe Adresse haben.
    {% elif error_code == 215 %}
      Wenn zwei verschiedene MCUs denselben Adresswert am Drehschalter haben.
    {% elif error_code == 216 %}
      Wenn die Inneneinheit nicht an einen MCU-Port angeschlossen ist, aber der Schalter am Port auf "Ein" gestellt ist.
    {% elif error_code == 217 %}
      Wenn die Inneneinheit an einen MCU-Port angeschlossen ist, die Inneneinheit jedoch einem MCU zugewiesen ist und der Schalter am Port auf "Aus" gestellt ist.
    {% elif error_code == 218 %}
      Wenn mindestens eine tatsächliche Anzahl von Inneneinheitsverbindungen höher ist als die Anzahl der dem MCU zugewiesenen Inneneinheiten.
    {% elif error_code == 219 %}
      Fehler am Temperatursensor des MCU-Ladeluftkühlereinlasses (Kurzschluss oder Unterbrechung).
    {% elif error_code == 220 %}
      Fehler am Temperatursensor des MCU-Ladeluftkühlerauslasses (Kurzschluss oder Unterbrechung).
    {% elif error_code == 221 %}
      Fehler am Außentemperatursensor der Außeneinheit (Kurzschluss oder Unterbrechung).
    {% elif error_code == 231 %}
      Fehler am COND-OUT-Temperatursensor der Hauptaußeneinheit (Kurzschluss oder Unterbrechung).
    {% elif error_code == 241 %}
      COND-OUT-Sensor ist getrennt.
    {% elif error_code == 251 %}
      Fehler am Ausblastemperatursensor von Kompressor 1 (Kurzschluss oder Unterbrechung).
    {% elif error_code == 257 %}
      Fehler am Ausblastemperatursensor von Kompressor 2 (Kurzschluss oder Unterbrechung).
    {% elif error_code == 262 %}
      Der Ausblastemperatursensor von Kompressor 1 ist vom Sensorhalter am Rohr getrennt.
    {% elif error_code == 263 %}
      Der Ausblastemperatursensor von Kompressor 2 ist vom Sensorhalter am Rohr getrennt.
    {% elif error_code == 266 %}
      Obersensor von Kompressor 1 ist getrennt.
    {% elif error_code == 267 %}
      Obersensor von Kompressor 2 ist getrennt.
    {% elif error_code == 269 %}
      Der Ansaugtemperatursensor ist vom Sensorhalter am Rohr getrennt.
    {% elif error_code == 276 %}
      Fehler am Obersensor von Kompressor 1 (Kurzschluss oder Unterbrechung).
    {% elif error_code == 277 %}
      Fehler am Obersensor von Kompressor 2 (Kurzschluss oder Unterbrechung).
    {% elif error_code == 291 %}
      Kältemittelleckage oder Fehler am Hochdrucksensor (Kurzschluss oder Unterbrechung).
    {% elif error_code == 296 %}
      Kältemittelleckage oder Fehler am Niederdrucksensor (Kurzschluss oder Unterbrechung).
    {% elif error_code == 308 %}
      Fehler am Ansaugtemperatursensor (Kurzschluss oder Unterbrechung).
    {% elif error_code == 311 %}
      Fehler am Temperatursensor des doppelwandigen Rohrs/Flüssigkeitsrohrs (Sekundärwärmetauscher) (Kurzschluss oder Unterbrechung).
    {% elif error_code == 320 %}
      OLP-Sensorfehler.
    {% elif error_code == 321 %}
      Fehler am EVI (ESC) IN-Temperatursensor (Kurzschluss oder Unterbrechung).
    {% elif error_code == 322 %}
      Fehler am EVI (ESC) OUT-Temperatursensor (Kurzschluss oder Unterbrechung).
    {% elif error_code == 323 %}
      Fehler am Ansaugsensor 2 (Kurzschluss oder Unterbrechung).
    {% elif error_code == 346 %}
      Fehler aufgrund eines Betriebsfehlers von Lüfter 2.
    {% elif error_code == 347 %}
      Das Motorkabel von Lüfter 2 ist nicht angeschlossen.
    {% elif error_code == 348 %}
      Sperrfehler bei Lüfter 2 der Außeneinheit.
    {% elif error_code == 353 %}
      Fehler aufgrund einer Überlastung des Motors von Lüfter 2 der Außeneinheit.
    {% elif error_code == 355 %}
      Fehler aufgrund einer Überhitzung des IPM von Lüfter 2.
    {% elif error_code == 361 %}
      Fehler aufgrund eines Betriebsfehlers des Inverter-Kompressors 2.
    {% elif error_code == 364 %}
      Fehler aufgrund eines Überstroms des Inverter-Kompressors 2.
    {% elif error_code == 365 %}
      V-Grenzwertfehler des Inverter-Kompressors 2.
    {% elif error_code == 366 %}
      Fehler aufgrund von Über- oder Unterspannung der Inverter-PBA2.
    {% elif error_code == 367 %}
      Fehler aufgrund eines nicht angeschlossenen Kabels von Kompressor 2.
    {% elif error_code == 368 %}
      Ausgangsstromsensorfehler der Inverter-PBA2.
    {% elif error_code == 369 %}
      DC-Spannungssensorfehler der Inverter-PBA2.
    {% elif error_code == 374 %}
      Kühlkörper-Temperatursensorfehler der Inverter-PBA2.
    {% elif error_code == 376 %}
      Fehler aufgrund eines Überstroms von Lüfter 2.
    {% elif error_code == 378 %}
      Fehler aufgrund des Eingangsstroms des Inverters 2.
    {% elif error_code == 386 %}
      Über- oder Unterspannungsfehler von Lüfter 2.
    {% elif error_code == 387 %}
      Hall-IC-Verbindungsfehler von Lüfter 2.
    {% elif error_code == 389 %}
      V-Grenzwertfehler bei Lüfter 2 des Kompressors.
    {% elif error_code == 393 %}
      Ausgangsstromsensorfehler von Lüfter 2.
    {% elif error_code == 396 %}
      DC-Spannungssensorfehler von Lüfter 2.
    {% elif error_code == 399 %}
      Fehler am Kühlkörper-Temperatursensor von Lüfter 2.
    {% elif error_code == 400 %}
      Fehler aufgrund von Überhitzung durch Kontaktfehler am IPM der Inverter-PBA2.
    {% elif error_code == 403 %}
      Erkennung des Einfrierens des VERDICHTERS DER AUSSENEINHEIT (Während des Kühlbetriebs).
    {% elif error_code == 404 %}
      Schutz der AUSSENEINHEIT bei Überlastung (während Sicherheits-, Start- oder Normalbetriebszustand).
    {% elif error_code == 407 %}
      Kompressorbetrieb gestoppt aufgrund der Hochdruckschutzregelung.
    {% elif error_code == 410 %}
      Kompressorbetrieb gestoppt aufgrund der Niederdruckschutzregelung oder Kältemittelleckage.
    {% elif error_code == 413 %}
      Kompressorbetrieb gestoppt aufgrund der Ausblastemperaturschutzregelung.
    {% elif error_code == 416 %}
      Die Ausblastemperatur eines Kompressors ist überhitzt.
    {% elif error_code == 425 %}
      Phasenvertauschung oder Phasenausfall (3φ Verdrahtung der Außeneinheit, R-S-T-N), Verbindungsfehler beim Drehstromanschluss.
    {% elif error_code == 428 %}
      Kompressorbetrieb gestoppt aufgrund eines abnormalen Kompressionsverhältnisses.
    {% elif error_code == 438 %}
      EVI (ESC) EEV-Leckage oder interne Leckage des Zwischenkühlers oder falsches Einstecken des Steckverbinders der EVI (ESC) EEV.
    {% elif error_code == 439 %}
      Fehler aufgrund von Kältemittelleckage.
    {% elif error_code == 440 %}
      Heizmodus-Einschränkung aufgrund hoher Lufttemperatur.
    {% elif error_code == 441 %}
      Kühlmodus-Einschränkung aufgrund niedriger Lufttemperatur.
    {% elif error_code == 442 %}
      Einschränkung des Kältemittelnachfüllens im Heizmodus, wenn die Lufttemperatur über 15 °C liegt.
    {% elif error_code == 443 %}
      Betrieb untersagt aufgrund eines Druckabfalls.
    {% elif error_code == 445 %}
      CCH ist getrennt.
    {% elif error_code == 446 %}
      Fehler aufgrund eines Betriebsfehlers von Lüfter 1.
    {% elif error_code == 447 %}
      Das Motorkabel von Lüfter 1 ist nicht angeschlossen.
    {% elif error_code == 448 %}
      Sperrfehler bei Lüfter 1.
    {% elif error_code == 452 %}
      Fehler aufgrund eines ZPC-Erkennungsstromkreisproblems oder Stromausfalls.
    {% elif error_code == 453 %}
      Fehler aufgrund eines überhitzten Motors von Lüfter 1 der Außeneinheit.
    {% elif error_code == 455 %}
      Fehler aufgrund einer Überhitzung des IPM von Lüfter 1.
    {% elif error_code == 458 %}
      Fehler bei LÜFTER 1 DER AUSSENEINHEIT.
    {% elif error_code == 461 %}
      Fehler aufgrund eines Betriebsfehlers des Inverter-Kompressors 1.
    {% elif error_code == 462 %}
      Kompressor gestoppt aufgrund der vollständigen Stromregelung oder Fehler aufgrund eines niedrigen Stroms an CT2.
    {% elif error_code == 463 %}
      OLP ist überhitzt.
    {% elif error_code == 464 %}
      Fehler aufgrund eines Überstroms des Inverter-Kompressors 1.
    {% elif error_code == 465 %}
      V-Grenzwertfehler des Inverter-Kompressors 1.
    {% elif error_code == 466 %}
      Fehler aufgrund von Über- oder Unterspannung der Inverter-PBA1.
    {% elif error_code == 467 %}
      Fehler aufgrund eines nicht angeschlossenen Kabels von Kompressor 1.
    {% elif error_code == 468 %}
      Ausgangsstromsensorfehler der Inverter-PBA1.
    {% elif error_code == 469 %}
      DC-Spannungssensorfehler der Inverter-PBA1.
    {% elif error_code == 470 %}
      EEPROM Lese-/Schreibfehler der Außeneinheit.
    {% elif error_code == 471 %}
      EEPROM Lese-/Schreibfehler der Außeneinheit (OTP-Fehler).
    {% elif error_code == 474 %}
      Kühlkörper-Temperatursensorfehler der Inverter-PBA1.
    {% elif error_code == 475 %}
      Fehler bei LÜFTER 2 DER AUSSENEINHEIT.
    {% elif error_code == 478 %}
      Fehler aufgrund eines Überstroms von Lüfter 1.
    {% elif error_code == 482 %}
      Fehler aufgrund des Eingangsstroms des Inverters 1.
    {% elif error_code == 484 %}
      PFC-Überlastfehler.
    {% elif error_code == 485 %}
      Eingangsstromsensorfehler.
    {% elif error_code == 486 %}
      Fehler aufgrund von Über- oder Unterspannung von Lüfter 1.
    {% elif error_code == 487 %}
      Hall-IC-Fehler von Lüfter 1.
    {% elif error_code == 489 %}
      V-Grenzwertfehler bei Lüfter 1 des Kompressors.
    {% elif error_code == 493 %}
      Ausgangsstromsensorfehler von Lüfter 1.
    {% elif error_code == 496 %}
      DC-Spannungssensorfehler von Lüfter 1.
    {% elif error_code == 499 %}
      Kühlkörper-Temperatursensorfehler von Lüfter 1.
    {% elif error_code == 500 %}
      Fehler aufgrund von Überhitzung durch Kontaktfehler am IPM der Inverter-PBA1.
    {% elif error_code == 503 %}
      Fehler zur Warnung des Benutzers, ob das Serviceventil geschlossen ist.
    {% elif error_code == 504 %}
      Fehler aufgrund der Selbstdiagnose des Kompressorbetriebs.
    {% elif error_code == 505 %}
      Fehler aufgrund der Selbstdiagnose des Hochdrucksensors.
    {% elif error_code == 506 %}
      Fehler aufgrund der Selbstdiagnose des Niederdrucksensors.
    {% elif error_code == 554 %}
      Fehler aufgrund eines Gaslecks.
    {% elif error_code == 560 %}
      Fehler bei der Einstellung des Optionsschalters der Außeneinheit (wenn ein ungeeigneter Optionsschalter eingeschaltet ist).
    {% elif error_code == 563 %}
      Fehler aufgrund der Modulinstallation einer Inneneinheit mit alter Version (Micom-Version muss aktualisiert werden).
    {% elif error_code == 573 %}
      Fehler durch Verwendung einer Einzel-Außeneinheit in einer Modulinstallation.
    {% elif error_code == 601 %}
      Kommunikationsfehler zwischen Fernbedienung und der DVM-Hydroeinheit / Hydroeinheit HT.
    {% elif error_code == 602 %}
      Kommunikationsfehler zwischen der Master- und Slave-Fernbedienung.
    {% elif error_code == 604 %}
      Verfolgungsfehler zwischen Fernbedienung und der DVM-Hydroeinheit / Hydroeinheit HT.
    {% elif error_code == 607 %}
      Kommunikationsfehler zwischen den verkabelten Master- und Slave-Fernbedienungen.
    {% elif error_code == 618 %}
      Fehler aufgrund der Überschreitung der maximalen Anzahl an installierten Hydroeinheiten (16 Einheiten).
    {% elif error_code == 627 %}
      Fehler aufgrund der Überschreitung der maximalen Anzahl an installierten verkabelten Fernbedienungen (2 Einheiten).
    {% elif error_code == 633 %}
      Fehler durch die Installation gemischter Modelle.
    {% elif error_code == 635 %}
      Der Temperatursensor der Fernbedienung ist nicht angeschlossen oder defekt.
    {% elif error_code == 654 %}
      Datenfehler an der Fernbedienung (Speicher-Lese-/Schreibfehler).
    {% elif error_code == 702 %}
      Fehler aufgrund eines geschlossenen EEV der Inneneinheit (Erste Erkennung).
    {% elif error_code == 703 %}
      Fehler aufgrund eines geöffneten EEV der Inneneinheit (Erste Erkennung).
    {% elif error_code == 899 %}
      Kurzschluss oder Unterbrechung des Temperaturfühlers für den Wasseraustritt in Zone 1.
    {% elif error_code == 900 %}
      Kurzschluss oder Unterbrechung des Temperaturfühlers für den Wasseraustritt in Zone 2.
    {% elif error_code == 901 %}
      Fehler am Sensor des Wassereinlassrohrs (Kurzschluss oder Unterbrechung).
    {% elif error_code == 902 %}
      Fehler am Sensor des Wasserauslassrohrs (Kurzschluss oder Unterbrechung).
    {% elif error_code == 903 %}
      Fehler am Temperaturfühler für den Wasserauslass (Backup-Heizung).
    {% elif error_code == 904 %}
      Fehler am Wassertanksensor (Kurzschluss oder Unterbrechung).
    {% elif error_code == 906 %}
      Fehler am Temperatursensor des Verdampfer-Einlasses der Außeneinheit (Kurzschluss oder Unterbrechung).
    {% elif error_code == 907 %}
      Fehler aufgrund des Rohrbruchschutzes.
    {% elif error_code == 908 %}
      Fehler aufgrund des Frostschutzes (Wiederbetrieb möglich).
    {% elif error_code == 909 %}
      Fehler aufgrund des Frostschutzes (Wiederbetrieb nicht möglich).
    {% elif error_code == 910 %}
      Der Wassertemperatursensor am Wasserauslassrohr ist abgetrennt.
    {% elif error_code == 911 %}
      Durchfluss-Schalterfehler, wenn der Schalter innerhalb von 10 Sekunden nach dem Start der Pumpe ausgeschaltet wird (Wiederbetrieb möglich).
    {% elif error_code == 912 %}
      Fehler der normalen Durchflussrate.
    {% elif error_code == 913 %}
      Sechsmalige Erkennung eines Durchfluss-Schalterfehlers (Wiederbetrieb nicht möglich).
    {% elif error_code == 914 %}
      Fehler aufgrund einer falschen Thermostatverbindung.
    {% elif error_code == 915 %}
      Fehler am DC-Lüfter (nicht in Betrieb).
    {% elif error_code == 916 %}
      Fehler am Temperatursensor des Mischventils (Kurzschluss oder Unterbrechung).
    {% elif error_code == 919 %}
      Die eingestellte Temperatur für den Desinfektionsbetrieb wurde nicht erreicht oder konnte nach Erreichen nicht für die erforderliche Zeit gehalten werden.
    {% elif error_code == "unknown" %}
    {% else %}
      Unbekannter Fehlercode: {{ error_code }}. Bitte konsultieren Sie das Handbuch der Klimaanlage.
    {% endif %}
  is_ios: !input is_ios
  notification_title: !input notification_title
  notification_message: !input notification_message

action:
  - device_id: !input notify_device
    domain: mobile_app
    type: notify
    title: "{{ notification_title }}"
    message: "{{ notification_message }}"
    data: >
      {% set ios_data = {} %}
      {% set android_data = {} %}
      {{ ios_data if is_ios else android_data }}

mode: single
